<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Garland Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yeseva+One&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --plum:#2b0f33; --plum-2:#42184d; --marigold:#f6a81c; --rose:#e63e6d;
  --ivory:#fff3dc; --leaf:#3f8a52;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:radial-gradient(120% 80% at 50% 0%,var(--plum-2),var(--plum) 70%);
  color:var(--ivory); font-family:Nunito,system-ui,sans-serif;
  display:flex; flex-direction:column; align-items:center;
  padding:28px 14px 40px; overflow-x:hidden; min-height:100vh;
}
h1{font-family:"Yeseva One",serif;font-weight:400;font-size:clamp(2rem,7vw,3.6rem);margin:0;text-align:center;line-height:1.1}
.hint{margin:10px 0 0;text-align:center;opacity:.85;font-size:1.05rem;max-width:34ch}

.stage{display:flex;gap:clamp(10px,4vw,48px);margin-top:28px;width:100%;max-width:760px;justify-content:center}
.person{flex:1;max-width:340px;text-align:center}
.frame{
  position:relative;aspect-ratio:3/4;border-radius:999px 999px 20px 20px;
  border:4px solid var(--marigold);background:var(--plum-2);overflow:visible;
  transition:box-shadow .3s, transform .3s;
}
.frame img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
.frame.missing img{display:none}
.frame.missing::before{
  content:attr(data-missing);position:absolute;inset:0;display:grid;place-items:center;
  padding:20px;text-align:center;opacity:.6;font-size:.95rem;
}
.frame.over{box-shadow:0 0 0 6px rgba(246,168,28,.35),0 0 40px rgba(246,168,28,.5);transform:scale(1.02)}
.name{font-family:"Yeseva One",serif;font-size:1.4rem;margin-top:12px}

.tray{
  margin-top:34px;display:flex;gap:24px;justify-content:center;align-items:center;
  padding:16px 22px;border:2px dashed rgba(255,243,220,.35);border-radius:20px;min-height:140px;
}
.cell{width:150px;min-height:112px;display:grid;place-items:center}
.garland{
  display:block;width:150px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;
  filter:drop-shadow(0 4px 6px rgba(0,0,0,.4));
}
.garland svg{display:block;width:100%;height:auto;pointer-events:none}
.garland:focus-visible{outline:3px solid var(--ivory);outline-offset:4px;border-radius:12px}
.garland.drag{position:fixed;z-index:50;cursor:grabbing;transform:scale(1.15) rotate(-4deg);transition:none}
.garland.worn{position:absolute;left:50%;bottom:2%;width:96%;transform:translateX(-50%);z-index:5;animation:drop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes drop{from{transform:translate(-50%,-40px) scale(1.2)}to{transform:translate(-50%,0) scale(1)}}

.banner{
  position:fixed;inset:0;display:none;place-items:center;pointer-events:none;z-index:40;text-align:center;
}
body.done .banner{display:grid}
.banner div{
  font-family:"Yeseva One",serif;font-size:clamp(2.4rem,11vw,6rem);color:var(--marigold);
  text-shadow:0 4px 0 var(--rose),0 0 40px rgba(0,0,0,.6);animation:pop .8s cubic-bezier(.3,1.6,.5,1);
}
.banner small{display:block;font-family:Nunito,sans-serif;font-size:clamp(1rem,3.5vw,1.5rem);color:var(--ivory);text-shadow:none;margin-top:8px}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
body.done .frame{box-shadow:0 0 0 6px rgba(246,168,28,.35),0 0 50px rgba(246,168,28,.6)}

button{
  margin-top:24px;font:inherit;font-weight:700;color:var(--plum);background:var(--marigold);
  border:0;border-radius:999px;padding:12px 26px;cursor:pointer;position:relative;z-index:60;
}
button:focus-visible{outline:3px solid var(--ivory);outline-offset:3px}
canvas{position:fixed;inset:0;pointer-events:none;z-index:45}
@media (max-width:480px){
  .tray{gap:8px;padding:12px}
  .cell{width:120px}.garland{width:120px}
}
@media (prefers-reduced-motion:reduce){.garland.worn,.banner div{animation:none}}
</style>
</head>
<body>

<h1 id="title"></h1>
<p class="hint">Pick up a garland and drop it on each of them.</p>

<div class="stage">
  <div class="person">
    <div class="frame" data-slot="groom" data-missing="Add groom.jpg to the project folder">
      <img src="groom.jpg" alt="Groom">
    </div>
    <div class="name" id="n1"></div>
  </div>
  <div class="person">
    <div class="frame" data-slot="bride" data-missing="Add bride.jpg to the project folder">
      <img src="bride.jpg" alt="Bride">
    </div>
    <div class="name" id="n2"></div>
  </div>
</div>

<div class="tray" id="tray">
  <div class="cell" data-home="0"></div>
  <div class="cell" data-home="1"></div>
</div>

<button id="reset" type="button">Start over</button>

<div class="banner" aria-live="polite"><div>Just married!<small id="sub"></small></div></div>
<canvas id="fx"></canvas>

<script>
/* ---- Edit these ---- */
const CONFIG = {
  groom: "Groom",
  bride: "Bride",
  subtitle: "Two garlands, one forever."
};
/* -------------------- */

document.getElementById("title").textContent = CONFIG.groom + " & " + CONFIG.bride;
document.getElementById("n1").textContent = CONFIG.groom;
document.getElementById("n2").textContent = CONFIG.bride;
document.getElementById("sub").textContent = CONFIG.subtitle;
document.title = CONFIG.groom + " & " + CONFIG.bride;

// Missing photo fallback
document.querySelectorAll(".frame img").forEach(img => {
  const f = img.parentElement;
  const check = () => { if (!img.naturalWidth) f.classList.add("missing"); };
  img.addEventListener("error", () => f.classList.add("missing"));
  if (img.complete) check();
});

// Build a garland SVG
function makeGarland(c1, c2, c3) {
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", "0 0 200 140");
  const pts = [];
  const N = 15;
  for (let i = 0; i < N; i++) {
    const t = i / (N - 1), x = 14 + t * 172;
    const y = 12 + 108 * (1 - Math.pow((x - 100) / 86, 2));
    pts.push([x, y]);
  }
  const path = document.createElementNS(ns, "path");
  path.setAttribute("d", "M" + pts.map(p => p.join(",")).join(" L"));
  path.setAttribute("stroke", "#3f8a52"); path.setAttribute("stroke-width", "5");
  path.setAttribute("fill", "none"); path.setAttribute("stroke-linejoin", "round");
  svg.appendChild(path);
  pts.forEach((p, i) => {
    const g = document.createElementNS(ns, "g");
    const col = i % 3 === 1 ? c2 : c1;
    [[0,-7],[7,0],[0,7],[-7,0]].forEach(([dx, dy]) => {
      const pe = document.createElementNS(ns, "circle");
      pe.setAttribute("cx", p[0] + dx); pe.setAttribute("cy", p[1] + dy);
      pe.setAttribute("r", 7); pe.setAttribute("fill", col);
      pe.setAttribute("stroke", "rgba(0,0,0,.25)"); pe.setAttribute("stroke-width", "1");
      g.appendChild(pe);
    });
    const mid = document.createElementNS(ns, "circle");
    mid.setAttribute("cx", p[0]); mid.setAttribute("cy", p[1]);
    mid.setAttribute("r", 4.5); mid.setAttribute("fill", c3);
    g.appendChild(mid);
    svg.appendChild(g);
  });
  return svg;
}

const frames = [...document.querySelectorAll(".frame")];
const cells = [...document.querySelectorAll(".cell")];
const garlands = [
  makeGarland("#f6a81c", "#ff7a1a", "#b8460b"),
  makeGarland("#e63e6d", "#ff9fb8", "#fff3dc")
].map((svg, i) => {
  const g = document.createElement("div");
  g.className = "garland"; g.tabIndex = 0;
  g.setAttribute("role", "button");
  g.setAttribute("aria-label", (i ? "Rose" : "Marigold") + " garland. Press Enter to place it.");
  g.appendChild(svg);
  g.home = cells[i]; cells[i].appendChild(g);
  return g;
});
frames.forEach(f => f.occupant = null);

function goHome(g) {
  const f = frames.find(x => x.occupant === g);
  if (f) f.occupant = null;
  g.classList.remove("worn", "drag");
  g.style.left = g.style.top = "";
  g.home.appendChild(g);
}
function place(g, frame) {
  const old = frame.occupant;
  const from = frames.find(x => x.occupant === g);
  if (from) from.occupant = null;
  if (old && old !== g) goHome(old);
  frame.occupant = g;
  g.classList.remove("drag"); g.classList.add("worn");
  g.style.left = g.style.top = "";
  frame.appendChild(g);
  if (frames.every(f => f.occupant)) celebrate();
}
function frameAt(x, y) {
  const m = 24;
  return frames.find(f => {
    const r = f.getBoundingClientRect();
    return x > r.left - m && x < r.right + m && y > r.top - m && y < r.bottom + m;
  });
}

// Drag handling (mouse + touch)
garlands.forEach(g => {
  let sx, sy, moved, startedWorn, w;
  g.addEventListener("pointerdown", e => {
    e.preventDefault();
    g.setPointerCapture(e.pointerId);
    sx = e.clientX; sy = e.clientY; moved = false;
    startedWorn = g.classList.contains("worn");
    w = 150;
  });
  g.addEventListener("pointermove", e => {
    if (!g.hasPointerCapture(e.pointerId)) return;
    if (!moved && Math.hypot(e.clientX - sx, e.clientY - sy) < 6) return;
    if (!moved) {
      moved = true;
      const f = frames.find(x => x.occupant === g);
      if (f) f.occupant = null;
      g.classList.remove("worn"); g.classList.add("drag");
      document.body.appendChild(g);
      w = g.getBoundingClientRect().width / 1.15;
    }
    g.style.left = (e.clientX - w / 2) + "px";
    g.style.top = (e.clientY - w * .35) + "px";
    const over = frameAt(e.clientX, e.clientY);
    frames.forEach(f => f.classList.toggle("over", f === over));
  });
  g.addEventListener("pointerup", e => {
    frames.forEach(f => f.classList.remove("over"));
    if (!moved) {                       // plain tap
      if (startedWorn) goHome(g);
      else { const free = frames.find(f => !f.occupant); if (free) place(g, free); }
      return;
    }
    const target = frameAt(e.clientX, e.clientY);
    target ? place(g, target) : goHome(g);
  });
  g.addEventListener("keydown", e => {
    if (e.key !== "Enter" && e.key !== " ") return;
    e.preventDefault();
    if (g.classList.contains("worn")) goHome(g);
    else { const free = frames.find(f => !f.occupant); if (free) place(g, free); }
  });
});

// Celebration
const cv = document.getElementById("fx"), ctx = cv.getContext("2d");
let parts = [], raf = null, endAt = 0;
const colors = ["#f6a81c", "#e63e6d", "#ff9fb8", "#fff3dc", "#ff7a1a", "#3f8a52"];
function size() { cv.width = innerWidth; cv.height = innerHeight; }
addEventListener("resize", size); size();

function burst(n, x, y) {
  for (let i = 0; i < n; i++) {
    parts.push({
      x: x ?? Math.random() * cv.width, y: y ?? -20,
      vx: (Math.random() - .5) * (y == null ? 3 : 14),
      vy: y == null ? Math.random() * 2 + 2 : -Math.random() * 12 - 4,
      r: Math.random() * 6 + 4, a: Math.random() * 6, va: (Math.random() - .5) * .3,
      c: colors[(Math.random() * colors.length) | 0], petal: Math.random() < .5
    });
  }
}
function tick(t) {
  ctx.clearRect(0, 0, cv.width, cv.height);
  if (t < endAt) { if (Math.random() < .6) burst(3); }
  parts = parts.filter(p => p.y < cv.height + 30);
  parts.forEach(p => {
    p.vy += .12; p.x += p.vx; p.y += p.vy; p.a += p.va; p.vx *= .99;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c;
    if (p.petal) { ctx.beginPath(); ctx.ellipse(0, 0, p.r, p.r / 2, 0, 0, 7); ctx.fill(); }
    else ctx.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * .6);
    ctx.restore();
  });
  raf = (parts.length || t < endAt) ? requestAnimationFrame(tick) : null;
}
function celebrate() {
  document.body.classList.add("done");
  if (matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  burst(80, cv.width * .2, cv.height * .8);
  burst(80, cv.width * .8, cv.height * .8);
  endAt = performance.now() + 6000;
  if (!raf) raf = requestAnimationFrame(tick);
}
document.getElementById("reset").addEventListener("click", () => {
  document.body.classList.remove("done");
  garlands.forEach(goHome);
  parts = []; endAt = 0;
});
</script>
</body>
</html>
